<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b4d"><meta name="description" content="Lapak Sidimpuan - marketplace lokal barang dan jasa di Padangsidimpuan."><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="description" content="Lapak Sidimpuan - marketplace lokal barang dan jasa di Padangsidimpuan."><title>Lapak Sidimpuan</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="brand" href="#home">Lapak <span>Sidimpuan</span></a><div class="header-actions"><button class="icon-btn" id="headerSearchBtn">⌕</button><button class="account-btn" id="accountBtn">Masuk</button></div></header>
<main id="app" class="app-shell"></main>
<div id="toast" class="toast"></div>
<div class="modal-backdrop hidden" id="authModal"><section class="modal auth-modal"><button class="modal-close" id="closeAuth">×</button><p class="eyebrow">AKUN LAPAK</p><h2 id="authTitle">Masuk</h2><p id="authDescription" class="muted">Masuk untuk mengelola akun.</p><div class="auth-tabs"><button class="tab active" id="loginTab">Masuk</button><button class="tab" id="registerTab">Daftar</button></div><form id="authForm"><div class="field register-only hidden"><label>Nama</label><input id="name" type="text" minlength="2"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6"></div><div class="field register-only hidden"><label>WhatsApp <span>(opsional)</span></label><input id="whatsapp" type="tel"></div><button class="btn primary full" id="authSubmit">Masuk</button><p id="authMessage" class="form-message"></p></form><div id="accountPanel" class="hidden"></div></section></div>
<div class="modal-backdrop hidden" id="listingModal"><section class="modal listing-modal"><button class="modal-close" id="closeListing">×</button><div id="listingDetail"></div></section></div><div class="modal-backdrop hidden" id="supportModal"><section class="modal"><button class="modal-close" id="closeSupport">×</button><p class="eyebrow">PUSAT BANTUAN</p><h2>Hubungi Admin</h2><p class="muted">Kirim masalahmu langsung ke panel admin. Simpan nomor tiket jika kamu perlu menindaklanjuti.</p><form id="supportForm"><div class="field"><label>Kategori</label><select id="supportCategory" required><option value="akun">Masalah akun</option><option value="listing">Masalah listing</option><option value="laporan">Laporan</option><option value="transaksi">Masalah transaksi</option><option value="teknis">Masalah teknis</option><option value="lainnya">Lainnya</option></select></div><div class="field"><label>Judul masalah</label><input id="supportSubject" maxlength="160" minlength="3" required placeholder="Contoh: Listing saya belum muncul"></div><div class="field"><label>Jelaskan masalah</label><textarea id="supportMessage" maxlength="5000" minlength="5" required placeholder="Jelaskan apa yang terjadi..."></textarea></div><button class="btn primary full" type="submit">Kirim ke Admin</button><p id="supportFormMessage" class="form-message"></p></form></section></div>
<nav class="bottom-nav"><a href="#home" data-nav="home"><span>⌂</span><small>Home</small></a><a href="#browse" data-nav="browse"><span>⌕</span><small>Jelajah</small></a><button id="sellNav"><span>＋</span><small>Jual</small></button><a href="#favorites" data-nav="favorites"><span>♡</span><small>Favorit</small></a><a href="#account" data-nav="account"><span>◎</span><small>Akun</small></a></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=20"></script></body></html>
